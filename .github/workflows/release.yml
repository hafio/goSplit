# Release pipeline: run the full gate set, build the distroless image, scan it
# with Trivy, and publish to GHCR. Triggered when a GitHub Release is published
# (and on v* tags for a dry run without pushing).
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Same correctness + CVE gates as CI (build/vet/test/cov + govulncheck).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build / vet / test / coverage
        run: |
          chmod +x scripts/dev.sh
          ./scripts/dev.sh build vet test cov
      - name: govulncheck (report-only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ./scripts/dev.sh vuln

  # Build the image, scan it, and push on a published release.
  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io requires a lowercase image path.
      - name: Compute image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Build once and load locally so Trivy can scan the exact artifact.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gating scan: fails the job (and blocks the push steps below) on any
      # fixable vulnerability. Scope with `severity:` to gate only some levels.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: table
          scanners: vuln
          exit-code: '1'
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push :<release-tag> and :latest only for a published release.
      - name: Push image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.event.release.tag_name }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
