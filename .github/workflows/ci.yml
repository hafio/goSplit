# Fast gates on every push / PR. Mirrors `./scripts/dev.sh build vet test cov`
# plus a report-only govulncheck — the same commands you run locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Correctness gates (build/vet/test/cov) are fatal — dev.sh `die`s on failure.
      - name: build / vet / test / coverage
        run: |
          chmod +x scripts/dev.sh
          ./scripts/dev.sh build vet test cov

      # CVE scan is report-only (never fails the build).
      - name: govulncheck (report-only)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          ./scripts/dev.sh vuln

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            scripts/coverage.out
            scripts/coverage.html
          if-no-files-found: ignore
