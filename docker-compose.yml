# Default: SQLite — no database container, just a data volume. One command:
#   docker compose up --build
#
# PostgreSQL: uncomment the `db` service + its depends_on, and set
#   DATABASE_URL=postgres://gosplit:gosplit@db:5432/gosplit?sslmode=disable
services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - gosplit-data:/data
    restart: unless-stopped
    # environment:
    #   # Scheduled backups. BACKUP_DIR must differ from AUTO_RESTORE_DIR.
    #   BACKUP_DIR: /data/backups
    #   BACKUP_CRON: "0 4 * * *"
    #   BACKUP_RETENTION_COUNT: "7"
    #   # Drop an archive here and restart to restore it. Any failure aborts
    #   # the boot, so remove the file once .gosplit-restored appears.
    #   AUTO_RESTORE_DIR: /data/restore
    # depends_on:
    #   - db

  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: gosplit
  #     POSTGRES_PASSWORD: gosplit
  #     POSTGRES_DB: gosplit
  #   volumes:
  #     - gosplit-pg:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  gosplit-data:
