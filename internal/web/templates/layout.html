<!doctype html>
<html lang="{{.Lang}}" data-accent="{{.Theme}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="{{themeHex .Theme false}}" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="{{themeHex .Theme true}}" media="(prefers-color-scheme: dark)">
  <meta name="htmx-config" content='{"globalViewTransitions":true}'>
  <title>{{if .Title}}{{.Title}} · {{end}}GoSplit</title>
  <link rel="icon" type="image/svg+xml" href="{{asset "favicon.svg"}}" id="favicon">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="{{asset "app.css"}}">
  <script src="{{asset "htmx.min.js"}}" defer></script>
  <script src="{{asset "idiomorph-ext.min.js"}}" defer></script>
</head>
{{/* Boosted navigations morph the body instead of replacing it, so open menus,
     focus and half-typed fields survive a swap. Page scripts still re-run:
     htmx rewrites parsed <script> nodes into executable clones before the
     swap, so a script new to the incoming page executes when morph inserts it. */}}
<body hx-boost="true" hx-indicator="body" hx-ext="morph" hx-swap="morph:innerHTML">
<header class="topbar">
  <a class="brand" href="/">GoSplit</a>
  {{if .User}}
  <nav class="nav" aria-label="Primary">
    <a href="/balances"{{if eq .Nav "balances"}} class="on"{{end}}><svg class="icon"><use href="{{asset "icons.svg"}}#wallet"/></svg>{{.T "nav.balances"}}</a>
    <a href="/friends"{{if eq .Nav "friends"}} class="on"{{end}}><svg class="icon"><use href="{{asset "icons.svg"}}#users"/></svg>{{.T "nav.friends"}}</a>
    <a href="/groups"{{if eq .Nav "groups"}} class="on"{{end}}><svg class="icon"><use href="{{asset "icons.svg"}}#home"/></svg>{{.T "nav.groups"}}</a>
    <a href="/activity"{{if eq .Nav "activity"}} class="on"{{end}}><svg class="icon"><use href="{{asset "icons.svg"}}#list"/></svg>{{.T "nav.activity"}}</a>
    <a href="/recurring"><svg class="icon"><use href="{{asset "icons.svg"}}#repeat"/></svg>{{.T "nav.recurring"}}</a>
    <a href="/expenses/new" class="a-btn sm"><svg class="icon"><use href="{{asset "icons.svg"}}#plus"/></svg>{{.T "expense.add"}}</a>
  </nav>
  <div class="spacer"></div>
  <a class="a-btn ghost icon-only" href="/profile" title="{{.T "action.profile"}}" aria-label="{{.T "action.profile"}}"><svg class="icon"><use href="{{asset "icons.svg"}}#user"/></svg></a>
  <details class="omenu">
    <summary class="a-btn ghost icon-only" aria-label="{{.T "action.options"}}"><svg class="icon"><use href="{{asset "icons.svg"}}#dots"/></svg></summary>
    <div class="omenu-panel">
      <a href="/import"><svg class="icon"><use href="{{asset "icons.svg"}}#download"/></svg>{{.T "nav.import"}}</a>
      <a href="/bank"><svg class="icon"><use href="{{asset "icons.svg"}}#banknote"/></svg>{{.T "nav.bank"}}</a>
      {{if .User.IsAdmin}}<a href="/admin"><svg class="icon"><use href="{{asset "icons.svg"}}#shield"/></svg>{{.T "action.admin"}}</a>{{end}}
      <form method="post" action="/logout" hx-boost="false">
        {{template "csrf" .CSRF}}
        <button type="submit" class="danger"><svg class="icon"><use href="{{asset "icons.svg"}}#log-out"/></svg>{{.T "action.signout"}}</button>
      </form>
    </div>
  </details>
  {{end}}
</header>

<main class="container">
  {{/* Flash and error sit outside #content so a freshness poll, which swaps
       only #content, can never wipe a message the user has not read. */}}
  {{if .Flash}}<div class="flash ok">{{.Flash}}</div>{{end}}
  {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
  <div id="content" data-v="">{{template "content" .}}</div>
  {{if and .User (pollable .Page)}}
  {{/* Freshness poller: re-asks for this page's content block every 10s, but
       only while the tab is visible and the user is not busy in it -- no
       focused control, no open menu or filter panel. The server fingerprints
       the rendered block and answers 204 when nothing changed, so a quiet poll
       costs a header exchange rather than a page. List and detail pages only
       (see the fragment registry in internal/web/view.go); forms are never
       polled, because morphing one under the user would discard their input. */}}
  <span class="poller" aria-hidden="true"
        hx-get="{{.Path}}"
        hx-trigger="every 10s [document.visibilityState === 'visible' && !document.getElementById('content').contains(document.activeElement) && !document.querySelector('#content details[open]')]"
        hx-target="#content"
        hx-swap="morph:{morphStyle:'innerHTML',ignoreActiveValue:true}"
        hx-indicator="this"
        hx-headers='{"X-Background": "1"}'
        hx-vals='js:{v: document.getElementById("content").dataset.v || ""}'
        hx-on::config-request="event.detail.path = location.pathname + location.search"
        hx-on::after-request="var v = event.detail.xhr.getResponseHeader('X-Fragment-Version'); if (v) document.getElementById('content').dataset.v = v"></span>
  {{end}}
</main>

<footer class="site-footer">
  <a href="https://github.com/hafio/gosplit" target="_blank" rel="noopener noreferrer">github.com/hafio/gosplit</a>
  {{if .Version}}<span class="ver">{{.Version}}</span>{{end}}
</footer>

<nav class="bottom-nav" aria-label="Mobile">
  {{if .User}}
  <a href="/balances"{{if eq .Nav "balances"}} class="on"{{end}}><svg class="icon"><use href="{{asset "icons.svg"}}#wallet"/></svg>{{.T "nav.balances"}}</a>
  <a href="/friends"{{if eq .Nav "friends"}} class="on"{{end}}><svg class="icon"><use href="{{asset "icons.svg"}}#users"/></svg>{{.T "nav.friends"}}</a>
  <a href="/expenses/new" class="fab" aria-label="{{.T "expense.add"}}"><svg class="icon"><use href="{{asset "icons.svg"}}#plus"/></svg></a>
  <a href="/groups"{{if eq .Nav "groups"}} class="on"{{end}}><svg class="icon"><use href="{{asset "icons.svg"}}#home"/></svg>{{.T "nav.groups"}}</a>
  <a href="/activity"{{if eq .Nav "activity"}} class="on"{{end}}><svg class="icon"><use href="{{asset "icons.svg"}}#list"/></svg>{{.T "nav.activity"}}</a>
  {{end}}
</nav>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  });
}
// Tint the favicon's "$" box with the active accent theme (resolves per
// selected theme and light/dark), falling back to the static favicon.svg.
(function () {
  try {
    var cs = getComputedStyle(document.documentElement);
    var bg = cs.getPropertyValue('--accent').trim();
    var fg = cs.getPropertyValue('--accent-ink').trim();
    if (!bg) return;
    var link = document.getElementById('favicon');
    if (!link) return;
    fetch(link.href).then(function (r) { return r.text(); }).then(function (svg) {
      svg = svg.replace(/(id="fav-box"[^>]*fill=")[^"]*(")/, '$1' + bg + '$2');
      if (fg) svg = svg.replace(/(id="fav-dollar"[^>]*fill=")[^"]*(")/, '$1' + fg + '$2');
      link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
    }).catch(function () { /* keep the static favicon */ });
  } catch (e) { /* keep the static favicon */ }
})();
</script>
{{if .User}}
<script>
// Bring a backgrounded tab back up to date without a full reload: re-request the
// current page and morph it in. Runs when the tab is refocused after a while, on
// bfcache restore, and when a Web Push delivery nudges us (see sw.js). Skipped
// while a form holds unsaved input so nothing typed is thrown away.
(function () {
  "use strict";
  if (window.__gsRefreshWired) return;
  window.__gsRefreshWired = true;

  var STALE_MS = 60000;
  var hiddenAt = 0;

  // Any control whose current value differs from the value the server rendered.
  function dirty() {
    var els = document.querySelectorAll("form input, form textarea, form select");
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (el.disabled || el.type === "hidden") continue;
      if (el.type === "checkbox" || el.type === "radio") {
        if (el.checked !== el.defaultChecked) return true;
      } else if (el.tagName === "SELECT") {
        for (var j = 0; j < el.options.length; j++) {
          if (el.options[j].selected !== el.options[j].defaultSelected) return true;
        }
      } else if (el.value !== el.defaultValue) {
        return true;
      }
    }
    return false;
  }

  function refresh() {
    if (document.hidden || !window.htmx || dirty()) return;
    // X-Background tells the server nobody is looking at this render yet, so it
    // must not consume a pending one-shot flash meant for a real navigation.
    htmx.ajax("GET", location.href, {
      target: "body",
      swap: "morph:innerHTML",
      headers: { "X-Background": "1" },
    });
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > STALE_MS) refresh();
    hiddenAt = 0;
  });

  window.addEventListener("pageshow", function (e) { if (e.persisted) refresh(); });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (e.data && e.data.type === "refresh") refresh();
    });
  }
})();
</script>
{{end}}
</body>
</html>
